function renderSlide(x,i){const footer=`<div class="slide-footer"><span>Robot SysID Lab · L1-S</span><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></div>`;if(x.type==='cover')return `<section class="slide cover"><div class="slide-head"><p class="kicker">${x.kicker}</p><span class="page-no">视觉适配样例</span></div><div class="slide-body"><h2>${x.title}</h2><p class="subtitle">${x.subtitle}</p></div><div class="slide-footer"><span>实验主题：输出限幅</span><span class="mono">tau_max ?</span></div></section>`;if(x.type==='question')return `<section class="slide"><div class="slide-head"><div><p class="kicker">${x.kicker}</p><h3>${x.title}</h3></div><span class="page-no">${String(i+1).padStart(2,'0')}</span></div><div class="slide-body two-col"><div class="stack"><p>${x.body}</p><div class="stack">${x.cards.map(([a,b])=>`<div class="card"><strong>${a}</strong><span>${b}</span></div>`).join('')}</div></div><div class="question-mark">?</div></div>${footer}</section>`;if(x.type==='boundary')return `<section class="slide"><div class="slide-head"><div><p class="kicker">${x.kicker}</p><h3>${x.title}</h3></div><span class="page-no">${String(i+1).padStart(2,'0')}</span></div><div class="slide-body"><p>${x.body}</p>${pipeline()}<div class="verdict"><strong>识别条件</strong>只有数据真正跨过并识别阈值时，<code>tau_max</code> 才能被恢复；否则应报告下界。</div></div>${footer}</section>`;if(x.type==='comparison')return `<section class="slide"><div class="slide-head"><div><p class="kicker">${x.kicker}</p><h3>${x.title}</h3></div><span class="page-no">${String(i+1).padStart(2,'0')}</span></div><div class="slide-body"><table><thead><tr><th>数据集</th><th>能支持什么</th></tr></thead><tbody>${x.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table><p>两组数据都比较无限幅与有限幅 Student，再使用预先声明的留出幅值族。</p></div>${footer}</section>`;return `<section class="slide"><div class="slide-head"><div><p class="kicker">${x.kicker}</p><h3>${x.title}</h3></div><span class="page-no">${String(i+1).padStart(2,'0')}</span></div><div class="slide-body two-col"><div class="callout"><strong>案例</strong><p>${x.body}</p></div><ul class="checklist">${x.checks.map(c=>`<li>${c}</li>`).join('')}</ul></div>${footer}</section>`}
function render(){if(!names.includes(style))style='base';stage.className=`stage style-${style}`;stage.innerHTML=renderSlide(slides[page],page);caption.textContent=styleInfo[style][0];note.textContent=`页面内容：封面 · 问题 · 实验边界 · 比较数据 · 想一想 · ${styleInfo[style][1]}`;styleButtons.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.style===style)));pageRail.innerHTML=slides.map((x,i)=>`<button type="button" role="tab" aria-label="第 ${i+1} 页" aria-selected="${i===page}" data-page="${i}">${i+1}</button>`).join('');pageRail.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=Number(b.dataset.page);render()}))}styleButtons.forEach(b=>b.addEventListener('click',()=>{style=b.dataset.style;render()}));render();
</script>
<script>
