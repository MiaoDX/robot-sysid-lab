<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
  <title id="title">Robot SysID Lab: knowledge and synthetic experiments</title>
  <desc id="desc">Knowledge connects explanation, visual evidence, and exploration. In the synthetic lab, an Oracle world generates commands and declared observations. A Student model is fitted only on training trajectories. Held-out trajectories and privileged Oracle truth reach validation separately; truth is not an estimator input. Reports explain parameter recovery, predictive accuracy, and later control or RL transfer. The same method scales from one degree of freedom to an actuator, a fixed-base leg, contact, Microduck, and Microban.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="truth-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
    </marker>
  </defs>
  <rect width="1120" height="860" rx="20" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17243a">
    <text x="40" y="46" font-size="28" font-weight="700">Learn the physics. Test the model.</text>
    <text x="40" y="75" font-size="17" fill="#526178">Two connected tracks, one repeatable experiment loop.</text>

    <!-- Knowledge is a first-class track, not just the final report. -->
    <rect x="32" y="100" width="1056" height="144" rx="18" fill="#edf2ff" stroke="#cbd5f4"/>
    <text x="56" y="128" font-size="13" font-weight="700" letter-spacing="1.5" fill="#3e5290">KNOWLEDGE TRACK</text>
    <text x="72" y="168" font-size="22" font-weight="700">Explain</text>
    <text x="72" y="199" font-size="17" fill="#526178">Concepts &amp; model assumptions</text>
    <path d="M 353 177 H 397" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="420" y="168" font-size="22" font-weight="700">Show</text>
    <text x="420" y="199" font-size="17" fill="#526178">Curves, diagrams &amp; robot motion</text>
    <path d="M 703 177 H 747" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="768" y="168" font-size="22" font-weight="700">Explore</text>
    <text x="768" y="199" font-size="17" fill="#526178">Change a setting, test an idea</text>

    <!-- A two-way relationship between the course and the experiments. -->
    <path d="M 124 246 V 294" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 996 296 V 249" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="560" y="277" text-anchor="middle" font-size="16" fill="#526178">Questions guide experiments. Evidence makes concepts visible.</text>

    <rect x="32" y="300" width="1056" height="290" rx="18" fill="#ffffff" stroke="#d8e0eb"/>
    <text x="56" y="328" font-size="13" font-weight="700" letter-spacing="1.5" fill="#376d68">SYNTHETIC LAB</text>
    <text x="1064" y="328" text-anchor="end" font-size="14" fill="#526178">Declared inputs · reproducible runs</text>

    <!-- Held-out observations bypass parameter fitting. -->
    <path d="M 433 386 V 358 H 959 V 381" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="581" y="347" width="234" height="23" rx="8" fill="#ffffff"/>
    <text x="698" y="363" text-anchor="middle" font-size="15" fill="#526178">held-out trajectories</text>

    <rect x="56" y="387" width="222" height="126" rx="14" fill="#edf8f4" stroke="#93cdb8"/>
    <text x="74" y="421" font-size="22" font-weight="700" fill="#205e4d">Oracle world</text>
    <text x="74" y="452" font-size="17">Known physics + state</text>
    <text x="74" y="482" font-size="16" fill="#526178">Excitation → motion</text>

    <path d="M 281 453 H 316" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="322" y="387" width="222" height="126" rx="14" fill="#eff6ff" stroke="#a5c7ef"/>
    <text x="340" y="421" font-size="22" font-weight="700" fill="#28588b">Observations</text>
    <text x="340" y="452" font-size="17">Commands + signals</text>
    <text x="340" y="482" font-size="16" fill="#526178">Declared sensor access</text>

    <path d="M 547 453 H 582" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="588" y="387" width="222" height="126" rx="14" fill="#f5f0ff" stroke="#c9b5e8"/>
    <text x="606" y="421" font-size="22" font-weight="700" fill="#694492">Student model</text>
    <text x="606" y="452" font-size="17">Fit training trajectories</text>
    <text x="606" y="482" font-size="16" fill="#526178">Nominal → identified</text>

    <path d="M 813 453 H 848" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="854" y="387" width="210" height="126" rx="14" fill="#fff7e9" stroke="#e7c689"/>
    <text x="872" y="421" font-size="22" font-weight="700" fill="#825b15">Validation</text>
    <text x="872" y="452" font-size="17">Unseen-motion errors</text>
    <text x="872" y="482" font-size="16" fill="#526178">Before / after evidence</text>

    <!-- This route deliberately never enters the Student box. -->
    <path d="M 167 514 V 549 H 959 V 519" fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#truth-arrow)"/>
    <rect x="362" y="536" width="405" height="26" rx="10" fill="#ffffff"/>
    <text x="564" y="554" text-anchor="middle" font-size="16" font-weight="700" fill="#926016">Privileged truth → evaluation only</text>

    <path d="M 560 591 V 609" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="615" width="1056" height="119" rx="18" fill="#edf3f8" stroke="#d3deea"/>
    <text x="56" y="641" font-size="13" font-weight="700" letter-spacing="1.5" fill="#526178">VISUAL REPORTS &amp; SHARED LEARNING</text>
    <text x="56" y="677" font-size="20" font-weight="700">Parameter recovery</text>
    <text x="56" y="707" font-size="16" fill="#526178">When identifiable</text>
    <path d="M 377 660 V 710 M 736 660 V 710" stroke="#cbd5e1"/>
    <text x="407" y="677" font-size="20" font-weight="700">Prediction &amp; residuals</text>
    <text x="407" y="707" font-size="16" fill="#526178">On held-out motions</text>
    <text x="766" y="677" font-size="20" font-weight="700">Control / RL transfer</text>
    <text x="766" y="707" font-size="16" fill="#526178">In whole-robot studies</text>

    <text x="40" y="769" font-size="13" font-weight="700" letter-spacing="1.5" fill="#526178">SCALE THE SAME LOOP</text>
    <g fill="#ffffff" stroke="#d3deea">
      <rect x="40" y="787" width="158" height="43" rx="11"/>
      <rect x="216" y="787" width="158" height="43" rx="11"/>
      <rect x="392" y="787" width="158" height="43" rx="11"/>
      <rect x="568" y="787" width="158" height="43" rx="11"/>
      <rect x="744" y="787" width="158" height="43" rx="11"/>
      <rect x="920" y="787" width="158" height="43" rx="11"/>
    </g>
    <g font-size="16" text-anchor="middle" font-weight="700">
      <text x="119" y="814">1-DoF</text>
      <text x="295" y="814">Actuator</text>
      <text x="471" y="814">Fixed-base leg</text>
      <text x="647" y="814">Contact</text>
      <text x="823" y="814">Microduck</text>
      <text x="999" y="814">Microban</text>
    </g>
    <g font-size="18" text-anchor="middle" fill="#64748b">
      <text x="207" y="814">›</text>
      <text x="383" y="814">›</text>
      <text x="559" y="814">›</text>
      <text x="735" y="814">›</text>
      <text x="911" y="814">›</text>
    </g>
  </g>
</svg>
