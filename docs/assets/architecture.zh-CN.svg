<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
  <title id="title">Robot SysID Lab：知识与合成实验</title>
  <desc id="desc">知识连接解释、视觉证据与探索。Oracle 生成指令和声明的观测，Student 只拟合训练轨迹；留出轨迹与特权真值分别用于验证。报告区分参数恢复、预测和控制或 RL 迁移。同一流程从单自由度扩展到执行器、腿、接触、Microduck 和 Microban。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" />
    </marker>
    <marker id="truth-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207" />
    </marker>
  </defs>
  <rect width="1120" height="860" rx="20" fill="#f7f9fc" />
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#17243a">
    <text x="40" y="46" font-size="28" font-weight="700">理解物理，检验模型。</text>
    <text x="40" y="75" font-size="17" fill="#526178">相互连接的两条路线，同一个可重复的实验闭环。</text>


    <rect x="32" y="100" width="1056" height="144" rx="18" fill="#edf2ff" stroke="#cbd5f4" />
    <text x="56" y="128" font-size="13" font-weight="700" letter-spacing="1.5" fill="#3e5290">知识路线</text>
    <text x="72" y="168" font-size="22" font-weight="700">解释</text>
    <text x="72" y="199" font-size="17" fill="#526178">概念与模型假设</text>
    <path d="M 353 177 H 397" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="420" y="168" font-size="22" font-weight="700">展示</text>
    <text x="420" y="199" font-size="17" fill="#526178">曲线、示意图与机器人运动</text>
    <path d="M 703 177 H 747" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="768" y="168" font-size="22" font-weight="700">探索</text>
    <text x="768" y="199" font-size="17" fill="#526178">改变设置，检验想法</text>


    <path d="M 124 246 V 294" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 996 296 V 249" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="560" y="277" text-anchor="middle" font-size="16" fill="#526178">问题引导实验，证据让概念可见。</text>

    <rect x="32" y="300" width="1056" height="290" rx="18" fill="#ffffff" stroke="#d8e0eb" />
    <text x="56" y="328" font-size="13" font-weight="700" letter-spacing="1.5" fill="#376d68">合成实验</text>
    <text x="1064" y="328" text-anchor="end" font-size="14" fill="#526178">声明输入 · 可复现运行</text>


    <path d="M 433 386 V 358 H 959 V 381" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="581" y="347" width="234" height="23" rx="8" fill="#ffffff" />
    <text x="698" y="363" text-anchor="middle" font-size="15" fill="#526178">留出轨迹</text>

    <rect x="56" y="387" width="222" height="126" rx="14" fill="#edf8f4" stroke="#93cdb8" />
    <text x="74" y="421" font-size="22" font-weight="700" fill="#205e4d">Oracle 世界</text>
    <text x="74" y="452" font-size="17">已知物理与状态</text>
    <text x="74" y="482" font-size="16" fill="#526178">激励 → 运动</text>

    <path d="M 281 453 H 316" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />
    <rect x="322" y="387" width="222" height="126" rx="14" fill="#eff6ff" stroke="#a5c7ef" />
    <text x="340" y="421" font-size="22" font-weight="700" fill="#28588b">观测</text>
    <text x="340" y="452" font-size="17">指令与信号</text>
    <text x="340" y="482" font-size="16" fill="#526178">声明传感器访问范围</text>

    <path d="M 547 453 H 582" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />
    <rect x="588" y="387" width="222" height="126" rx="14" fill="#f5f0ff" stroke="#c9b5e8" />
    <text x="606" y="421" font-size="22" font-weight="700" fill="#694492">Student 模型</text>
    <text x="606" y="452" font-size="17">拟合训练轨迹</text>
    <text x="606" y="482" font-size="16" fill="#526178">初始 → 辨识后</text>

    <path d="M 813 453 H 848" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />
    <rect x="854" y="387" width="210" height="126" rx="14" fill="#fff7e9" stroke="#e7c689" />
    <text x="872" y="421" font-size="22" font-weight="700" fill="#825b15">验证</text>
    <text x="872" y="452" font-size="17">未见运动上的误差</text>
    <text x="872" y="482" font-size="16" fill="#526178">辨识前后的证据</text>


    <path d="M 167 514 V 549 H 959 V 519" fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#truth-arrow)" />
    <rect x="362" y="536" width="405" height="26" rx="10" fill="#ffffff" />
    <text x="564" y="554" text-anchor="middle" font-size="16" font-weight="700" fill="#926016">特权真值 → 仅用于评估</text>

    <path d="M 560 591 V 609" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="32" y="615" width="1056" height="119" rx="18" fill="#edf3f8" stroke="#d3deea" />
    <text x="56" y="641" font-size="13" font-weight="700" letter-spacing="1.5" fill="#526178">视觉报告与共同学习</text>
    <text x="56" y="677" font-size="20" font-weight="700">参数恢复</text>
    <text x="56" y="707" font-size="16" fill="#526178">在可辨识的条件下</text>
    <path d="M 377 660 V 710 M 736 660 V 710" stroke="#cbd5e1" />
    <text x="407" y="677" font-size="20" font-weight="700">预测与残差</text>
    <text x="407" y="707" font-size="16" fill="#526178">在留出运动上</text>
    <text x="766" y="677" font-size="20" font-weight="700">控制 / RL 迁移</text>
    <text x="766" y="707" font-size="16" fill="#526178">在整机研究中</text>

    <text x="40" y="769" font-size="13" font-weight="700" letter-spacing="1.5" fill="#526178">扩展同一个闭环</text>
    <g fill="#ffffff" stroke="#d3deea">
      <rect x="40" y="787" width="158" height="43" rx="11" />
      <rect x="216" y="787" width="158" height="43" rx="11" />
      <rect x="392" y="787" width="158" height="43" rx="11" />
      <rect x="568" y="787" width="158" height="43" rx="11" />
      <rect x="744" y="787" width="158" height="43" rx="11" />
      <rect x="920" y="787" width="158" height="43" rx="11" />
    </g>
    <g font-size="16" text-anchor="middle" font-weight="700">
      <text x="119" y="814">单自由度</text>
      <text x="295" y="814">执行器</text>
      <text x="471" y="814">固定基座腿</text>
      <text x="647" y="814">接触</text>
      <text x="823" y="814">Microduck</text>
      <text x="999" y="814">Microban</text>
    </g>
    <g font-size="18" text-anchor="middle" fill="#64748b">
      <text x="207" y="814">›</text>
      <text x="383" y="814">›</text>
      <text x="559" y="814">›</text>
      <text x="735" y="814">›</text>
      <text x="911" y="814">›</text>
    </g>
  </g>
</svg>
